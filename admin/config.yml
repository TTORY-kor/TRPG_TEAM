backend:
  name: git-gateway
  branch: main

locale: ko
media_folder: "assets/images"
public_folder: "/assets/images"
site_url: "https://trpg-team.netlify.app"
display_url: "https://trpg-team.netlify.app"
logo_url: "/assets/images/icon.jpg"

collections:
  - name: "site"
    label: "사이트 설정"
    files:
      - name: "site"
        label: "기본 설정과 테마"
        file: "assets/data/site.json"
        format: "json"
        fields:
          - {label: "팀 이름", name: "teamName", widget: "string"}
          - {label: "메인 제목", name: "title", widget: "string"}
          - {label: "소개 문구", name: "description", widget: "text"}
          - label: "전체 색상"
            name: "colors"
            widget: "object"
            fields:
              - {label: "강조색", name: "accent", widget: "color", allowInput: true}
              - {label: "페이지 배경", name: "background", widget: "color", allowInput: true}
              - {label: "카드 배경", name: "card", widget: "color", allowInput: true}
              - {label: "기본 글자", name: "text", widget: "color", allowInput: true}
              - {label: "보조 글자", name: "subText", widget: "color", allowInput: true}
              - {label: "구분선", name: "line", widget: "color", allowInput: true}
              - {label: "어두운 카드", name: "darkCard", widget: "color", allowInput: true}
              - {label: "어두운 카드 글자", name: "darkText", widget: "color", allowInput: true}
              - {label: "배너 음영", name: "heroShade", widget: "color", allowInput: true}
          - {label: "헤더 이미지", name: "heroImage", widget: "image"}
          - {label: "프로필 이미지", name: "profileImage", widget: "image"}
          - {label: "프로필 이름", name: "profileName", widget: "string"}
          - {label: "소개 1", name: "profileSub1", widget: "string", required: false}
          - {label: "소개 2", name: "profileSub2", widget: "string", required: false}
          - {label: "진행 기간 문구", name: "profileSince", widget: "string", required: false}
          - label: "주요 링크"
            name: "profileLinks"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - {label: "링크 이름", name: "label", widget: "string"}
              - {label: "주소", name: "url", widget: "string"}
          - {label: "메인 일러스트", name: "mainImage", widget: "image"}
          - {label: "음악 제목", name: "musicTitle", widget: "string", required: false}
          - {label: "아티스트", name: "musicArtist", widget: "string", required: false}
          - {label: "YouTube 영상 ID", name: "musicYoutubeId", widget: "string", required: false}
          - {label: "하단 문구", name: "footer", widget: "string", required: false}

  - name: "schedules"
    label: "진행 일정"
    files:
      - name: "schedules"
        label: "일정 목록"
        file: "assets/data/schedules.json"
        format: "json"
        fields:
          - label: "일정"
            name: "items"
            widget: "list"
            root: true
            summary: "{{fields.date}} · {{fields.title}}"
            fields:
              - {label: "날짜", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
              - {label: "시간", name: "time", widget: "string", required: false}
              - {label: "제목", name: "title", widget: "string"}
              - {label: "설명", name: "description", widget: "text", required: false}
              - {label: "장소", name: "location", widget: "string", required: false}
              - {label: "관련 주소", name: "url", widget: "string", required: false}
              - {label: "공개 상태", name: "status", widget: "select", options: ["공개", "비공개"], default: "공개"}

  - name: "notices"
    label: "공지사항"
    files:
      - name: "notices"
        label: "공지 목록"
        file: "assets/data/notices.json"
        format: "json"
        fields:
          - label: "공지"
            name: "items"
            widget: "list"
            root: true
            summary: "{{fields.date}} · {{fields.title}}"
            fields:
              - {label: "날짜", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
              - {label: "제목", name: "title", widget: "string"}
              - {label: "내용", name: "content", widget: "text"}
              - {label: "관련 주소", name: "url", widget: "string", required: false}
              - {label: "상단 고정", name: "pinned", widget: "boolean", default: false}
              - {label: "공개 상태", name: "status", widget: "select", options: ["공개", "비공개"], default: "공개"}

  - name: "sheets"
    label: "시트"
    files:
      - name: "sheets"
        label: "시트 게시 목록"
        file: "assets/data/sheets.json"
        format: "json"
        fields:
          - label: "시트"
            name: "items"
            widget: "list"
            root: true
            summary: "{{fields.title}}"
            fields:
              - {label: "제목", name: "title", widget: "string"}
              - {label: "담당/소유자", name: "owner", widget: "string", required: false}
              - {label: "설명", name: "description", widget: "text", required: false}
              - {label: "대표 이미지", name: "image", widget: "image", required: false}
              - {label: "시트 주소", name: "url", widget: "string", required: false}
              - {label: "메모", name: "content", widget: "text", required: false}
              - {label: "공개 상태", name: "status", widget: "select", options: ["공개", "잠금", "비공개"], default: "공개"}

  - name: "handouts"
    label: "핸드아웃"
    files:
      - name: "handouts"
        label: "핸드아웃 목록"
        file: "assets/data/handouts.json"
        format: "json"
        fields:
          - label: "핸드아웃"
            name: "items"
            widget: "list"
            root: true
            summary: "{{fields.title}} · {{fields.status}}"
            fields:
              - {label: "제목", name: "title", widget: "string"}
              - {label: "등록일", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false}
              - {label: "분류", name: "category", widget: "string", required: false}
              - {label: "설명", name: "description", widget: "text", required: false}
              - {label: "대표 이미지", name: "image", widget: "image", required: false}
              - {label: "첨부 파일", name: "file", widget: "file", required: false}
              - {label: "외부 주소", name: "url", widget: "string", required: false}
              - {label: "본문", name: "content", widget: "text", required: false}
              - {label: "공개 상태", name: "status", widget: "select", options: ["공개", "잠금", "비공개"], default: "공개"}

  - name: "characters"
    label: "등장인물"
    files:
      - name: "characters"
        label: "플레이어 캐릭터"
        file: "assets/data/characters.json"
        format: "json"
        fields:
          - label: "캐릭터"
            name: "items"
            widget: "list"
            root: true
            summary: "{{fields.name}}"
            fields:
              - {label: "ID", name: "id", widget: "string"}
              - {label: "이름", name: "name", widget: "string"}
              - {label: "배너", name: "banner", widget: "image"}
              - {label: "스탠딩", name: "standing", widget: "image"}
              - {label: "강조색", name: "accent", widget: "color", allowInput: true}
              - {label: "한마디", name: "quote", widget: "string", required: false}
              - {label: "직업", name: "job", widget: "string", required: false}
              - {label: "나이", name: "age", widget: "string", required: false}
              - {label: "거주지", name: "location", widget: "string", required: false}
              - label: "소개 항목"
                name: "story"
                widget: "list"
                required: false
                fields:
                  - {label: "제목", name: "title", widget: "string"}
                  - {label: "내용", name: "content", widget: "text"}
              - {label: "공개 상태", name: "status", widget: "select", options: ["공개", "비공개"], default: "공개"}
      - name: "npc"
        label: "관계 인물"
        file: "assets/data/npc.json"
        format: "json"
        fields:
          - label: "인물"
            name: "items"
            widget: "list"
            root: true
            summary: "{{fields.name}}"
            fields:
              - {label: "이름", name: "name", widget: "string"}
              - {label: "이미지", name: "image", widget: "image"}
              - {label: "관계", name: "relation", widget: "select", options: ["적", "아군", "중립", "의뢰인"]}
              - {label: "설명", name: "description", widget: "text", required: false}
              - {label: "공개 상태", name: "status", widget: "select", options: ["공개", "비공개"], default: "공개"}

  - name: "records"
    label: "세션 기록"
    files:
      - name: "records"
        label: "기록 목록"
        file: "assets/data/records.json"
        format: "json"
        fields:
          - label: "기록"
            name: "items"
            widget: "list"
            root: true
            summary: "{{fields.session}} · {{fields.title}}"
            fields:
              - {label: "회차", name: "session", widget: "string", required: false}
              - {label: "날짜", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
              - {label: "제목", name: "title", widget: "string"}
              - {label: "요약", name: "summary", widget: "text", required: false}
              - {label: "대표 이미지", name: "image", widget: "image", required: false}
              - {label: "본문 기록", name: "content", widget: "text", required: false}
              - {label: "로그/기록 주소", name: "url", widget: "string", required: false}
              - {label: "공개 상태", name: "status", widget: "select", options: ["공개", "비공개"], default: "공개"}

  - name: "gallery"
    label: "갤러리"
    files:
      - name: "gallery"
        label: "이미지 목록"
        file: "assets/data/gallery.json"
        format: "json"
        fields:
          - label: "이미지"
            name: "items"
            widget: "list"
            root: true
            summary: "{{fields.credit}}"
            fields:
              - {label: "이미지", name: "image", widget: "image"}
              - {label: "크레딧", name: "credit", widget: "string", required: false}
              - {label: "공개 상태", name: "status", widget: "select", options: ["공개", "비공개"], default: "공개"}
