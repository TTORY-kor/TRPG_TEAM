<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TRPG_TEAM 관리자</title>
<style>
  body{margin:0;font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif}
  #boot{
    position:fixed;inset:0;display:grid;place-content:center;gap:10px;
    text-align:center;color:#6b7280;background:#eceef2;
  }
  #boot strong{font-size:.82rem;letter-spacing:.16em;color:#4a4f9e}
  #boot span{font-size:.84rem}
</style>
</head>
<body>

<div id="boot">
  <strong>TRPG_TEAM</strong>
  <span>관리자를 여는 중입니다</span>
</div>

<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<!-- 버전을 고정합니다. ^3.8.0으로 두면 새 버전이 나올 때마다 화면이 바뀝니다. -->
<script src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"></script>
<script>
  // CMS가 뜨면 안내 화면을 걷어냅니다.
  (function () {
    var boot = document.getElementById('boot');
    var tries = 0;
    var timer = setInterval(function () {
      if (window.CMS || ++tries > 60) { clearInterval(timer); if (boot) boot.remove(); }
    }, 250);
  })();
</script>
</body>
</html>
