<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>TRPG_TEAM 관리자</title>
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <main class="admin-shell">
    <header class="admin-header">
      <div>
        <p class="eyebrow">TRPG_TEAM</p>
        <h1>이미지 관리자</h1>
        <p>이미지를 선택하면 GitHub 저장소의 <code>assets/images</code>에 자동 저장합니다.</p>
      </div>
      <a class="site-link" href="./" target="_blank" rel="noopener">사이트 열기 ↗</a>
    </header>

    <section class="admin-card">
      <div class="field-grid">
        <label class="field">
          <span>Worker 주소</span>
          <input id="workerUrl" type="url" placeholder="https://trpg-team-admin.계정.workers.dev">
          <small>한 번 저장하면 이 브라우저에 기억됩니다.</small>
        </label>

        <label class="field">
          <span>관리자 비밀번호</span>
          <input id="adminPassword" type="password" autocomplete="current-password" placeholder="Cloudflare에 설정한 비밀번호">
        </label>
      </div>
    </section>

    <section class="admin-card">
      <h2>이미지 위치</h2>
      <div class="preset-grid" id="presetGrid">
        <button type="button" data-path="office.jpg">헤더 배너<br><code>office.jpg</code></button>
        <button type="button" data-path="icon.jpg">프로필<br><code>icon.jpg</code></button>
        <button type="button" data-path="main.png">메인 일러스트<br><code>main.png</code></button>
        <button type="button" data-path="Ho1.png">HO1 배너<br><code>Ho1.png</code></button>
        <button type="button" data-path="Ho2.png">HO2 배너<br><code>Ho2.png</code></button>
        <button type="button" data-path="Ho3.png">HO3 배너<br><code>Ho3.png</code></button>
        <button type="button" data-path="Ho4.png">HO4 배너<br><code>Ho4.png</code></button>
        <button type="button" data-path="Ho1Standing.png">HO1 스탠딩<br><code>Ho1Standing.png</code></button>
        <button type="button" data-path="gallery1.jpg">갤러리 1<br><code>gallery1.jpg</code></button>
        <button type="button" data-path="gallery2.jpg">갤러리 2<br><code>gallery2.jpg</code></button>
        <button type="button" data-path="gallery3.jpg">갤러리 3<br><code>gallery3.jpg</code></button>
        <button type="button" data-path="gallery4.jpg">갤러리 4<br><code>gallery4.jpg</code></button>
        <button type="button" data-path="gallery5.jpg">갤러리 5<br><code>gallery5.jpg</code></button>
        <button type="button" data-path="gallery6.jpg">갤러리 6<br><code>gallery6.jpg</code></button>
      </div>

      <label class="field custom-path">
        <span>저장할 파일명</span>
        <input id="fileName" type="text" value="main.png" spellcheck="false">
        <small>영문·숫자·하이픈·밑줄과 <code>.jpg</code>, <code>.jpeg</code>, <code>.png</code>, <code>.webp</code>, <code>.gif</code>만 허용됩니다.</small>
      </label>
    </section>

    <section class="admin-card upload-card">
      <label class="drop-zone" id="dropZone">
        <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
        <span class="drop-title">이미지를 클릭하거나 여기에 드래그</span>
        <span class="drop-help">최대 8MB</span>
      </label>

      <div class="preview-wrap" id="previewWrap" hidden>
        <img id="preview" alt="업로드 미리보기">
        <div>
          <strong id="previewName"></strong>
          <span id="previewSize"></span>
        </div>
      </div>

      <label class="field">
        <span>커밋 메시지</span>
        <input id="commitMessage" type="text" value="관리자 페이지에서 이미지 변경">
      </label>

      <button class="upload-button" id="uploadButton" type="button">GitHub에 업로드</button>
      <div class="status" id="status" aria-live="polite"></div>
    </section>

    <section class="admin-card caution">
      <h2>주의</h2>
      <p>이 페이지에는 GitHub 토큰이 들어가지 않습니다. 토큰은 Cloudflare Worker의 암호화된 Secret에만 보관합니다.</p>
      <p>업로드 후 GitHub Pages 재배포와 브라우저 캐시 때문에 사이트 반영까지 수십 초 정도 걸릴 수 있습니다.</p>
    </section>
  </main>

  <script src="assets/js/admin.js" defer></script>
</body>
</html>
